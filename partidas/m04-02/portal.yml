- name: Portal de pedidos en los servidores web
  hosts: web
  become: true
  tasks:
    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configurar el sitio del portal
      ansible.builtin.copy:
        src: files/portal.conf
        dest: /etc/nginx/sites-available/portal
        mode: "0644"
      register: portal_sitio_conf

    - name: Activar el sitio del portal
      ansible.builtin.file:
        src: /etc/nginx/sites-available/portal
        dest: /etc/nginx/sites-enabled/portal
        state: link

    - name: Quitar el sitio por defecto
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Crear la carpeta de la release
      ansible.builtin.file:
        path: "/srv/portal/releases/{{ portal_version }}"
        state: directory
        mode: "0755"

    - name: Copiar la release {{ portal_version }}
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/app/releases/{{ portal_version }}/"
        dest: "/srv/portal/releases/{{ portal_version }}/"
        mode: "0644"

    - name: Apuntar current a la release {{ portal_version }}
      ansible.builtin.file:
        src: "/srv/portal/releases/{{ portal_version }}"
        dest: /srv/portal/current
        state: link

    - name: Publicar el estado del nodo
      ansible.builtin.copy:
        dest: "/srv/portal/releases/{{ portal_version }}/estado.json"
        content: |
          {"host": "{{ inventory_hostname }}", "entorno": "{{ portal_entorno }}", "version": "{{ portal_version }}", "color": "{{ portal_color }}", "db": ""}
        mode: "0644"

    - name: Arrancar nginx
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Recargar nginx si ha cambiado el sitio
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: portal_sitio_conf is changed
