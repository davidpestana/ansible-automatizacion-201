# AWX Operator 2.19.1 (AWX 24.6.1) y la instancia «awx» del curso.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awx
resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
  - awx.yaml
images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1
  # gcr.io/kubebuilder ya no sirve esta imagen; es la misma publicada por su autor en quay.io.
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
    newTag: v0.15.0
