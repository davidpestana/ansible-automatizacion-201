apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
spec:
  service_type: nodeport
  nodeport_port: 30080
  admin_user: admin
  # La web se abre por la URL reenviada del Codespace (https://…-8043.app.github.dev): sin esto el login falla por CSRF.
  extra_settings:
    - setting: CSRF_TRUSTED_ORIGINS
      value:
        - https://*.app.github.dev
